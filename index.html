    <!--
      Resolve the theme BEFORE first paint so there is no flash (plan §3).
      Dark is the default; the `light` class is only added when chosen.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var light = stored ? stored === "light" : prefersLight;
          if (light) document.documentElement.classList.add("light");
        } catch (e) {
          /* localStorage blocked — fall through to dark */
        }
      })();
    </script>
